name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Detected Java Major Version: $JAVA_MAJOR_VERSION"
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Unable to detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_MAJOR_VERSION, which is lower than 17."
            exit 1
          fi
          echo "Java 17 or newer verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH."
          else
            echo "Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Debug keystore verified at $KEYSTORE_PATH."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK."
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a valid non-empty regular file."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have .apk extension."; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "APK successfully verified at $EXPECTED_APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "$TEMP_DIR"

          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO" | cut -d'/' -f2 | sed 's/[^a-zA-Z0-9._-]/_/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "asset_path=${DEST_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: release_step
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset invalid or missing at $ASSET_PATH."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset is not an .apk file."; exit 1 ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<'EOF'
This is an automatically generated debug APK.
The APK was built by GitHub Actions.

- Run Number: ${{ github.run_number }}
- Run Attempt: ${{ github.run_attempt }}
- Source Commit: ${{ github.sha }}

Notes:
- This APK is intended for testing purposes only.
- This is NOT a Play Store production release.
- The APK is signed only with a temporary debug keystore.
EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_OUTCOME="${{ steps.release_step.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Build & Release Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK was built and published to GitHub Releases:" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download:** You can download \`$ASSET_NAME\` directly under the **Assets** section of the release page on your phone or browser." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact:** The GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run page." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::GitHub Release publishing failed or was skipped."
            echo "APK build and verification succeeded."
            echo "The Actions artifact 'app-debug-apk' remains available."

            echo "### ⚠️ Debug APK Built (Release Publishing Failed)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK was compiled successfully, but release publishing encountered an issue." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact:** You can download the compiled APK artifact named **\`app-debug-apk\`** directly from the **Summary** page of this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
